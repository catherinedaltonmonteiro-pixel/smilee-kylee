<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter Experiences | Smilee Kylee</title>

  <style>
    :root{
      --lavender:#d8c5e8;
      --purple:#7d5a91;
      --deep-purple:#553765;
      --pink:#efd2df;
      --cream:#fffaf5;
      --white:#ffffff;
      --charcoal:#342f35;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--cream);
      color:var(--charcoal);
      line-height:1.7;
    }

    .emergency-bar{
      background:var(--deep-purple);
      color:white;
      text-align:center;
      padding:8px 20px;
      font-size:.9rem;
    }

    .funding-notice{
      background:#f3ebf7;
      color:var(--deep-purple);
      text-align:center;
      padding:10px 22px;
      font-size:.85rem;
      border-bottom:1px solid var(--lavender);
    }

    nav{
      background:rgba(255,255,255,.97);
      border-bottom:1px solid #eadfea;
      position:sticky;
      top:0;
      z-index:100;
    }

    .nav-inner{
      max-width:1200px;
      margin:auto;
      padding:15px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .brand{
      color:var(--deep-purple);
      font-size:1.35rem;
      font-weight:800;
      text-decoration:none;
      white-space:nowrap;
    }

    .nav-links{
      display:flex;
      flex-wrap:wrap;
      gap:17px;
      align-items:center;
    }

    .nav-links a{
      color:var(--charcoal);
      text-decoration:none;
      font-size:.92rem;
      font-weight:700;
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:var(--purple);
    }

    .hero{
      text-align:center;
      padding:85px 24px 55px;
      background:linear-gradient(135deg,#f3ebf7,#fffaf5,#fdf0f5);
    }

    .eyebrow{
      text-transform:uppercase;
      letter-spacing:3px;
      font-size:.8rem;
      font-weight:800;
      color:var(--purple);
      margin-bottom:10px;
    }

    h1,h2,h3{
      font-family:Georgia,"Times New Roman",serif;
      color:var(--deep-purple);
    }

    h1{
      font-size:clamp(3rem,7vw,5.6rem);
      line-height:1;
      margin:0 0 20px;
    }

    .hero p{
      max-width:760px;
      margin:auto;
      font-size:1.15rem;
    }

    .notice{
      max-width:950px;
      margin:35px auto 0;
      padding:20px 24px;
      border:1px solid var(--lavender);
      border-radius:18px;
      background:white;
      text-align:left;
      font-size:.92rem;
    }

    .board-wrap{
      max-width:1250px;
      margin:auto;
      padding:60px 24px 110px;
    }

    .board-header{
      max-width:750px;
      margin-bottom:35px;
    }

    .board-header h2{
      font-size:clamp(2.2rem,5vw,3.5rem);
      margin:0 0 10px;
    }

    .read-instruction{
      display:inline-block;
      margin-top:12px;
      padding:12px 18px;
      border-radius:999px;
      background:#f3ebf7;
      color:var(--deep-purple);
      font-weight:800;
    }

    .memory-board{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:34px 28px;
      align-items:start;
      padding:22px 10px 10px;
    }

    .memory-card{
      --tilt:0deg;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      min-height:240px;
      padding:34px;
      background:white;
      box-shadow:0 14px 34px rgba(70,45,80,.12);
      transform:rotate(var(--tilt));
      transform-origin:center;
      transition:transform .2s ease, box-shadow .2s ease;
      overflow:hidden;
      margin:0 auto;
      cursor:pointer;
    }

    .memory-card:hover{
      transform:rotate(0deg) translateY(-4px) scale(1.02);
      box-shadow:0 18px 38px rgba(70,45,80,.17);
      z-index:3;
    }
